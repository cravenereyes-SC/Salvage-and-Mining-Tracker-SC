<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session History - Star Citizen Tracker</title>
    <meta name="description" content="Review active, completed and failed sessions with profit, loss and work order summaries." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles/main.css" />
    <link rel="stylesheet" href="src/styles/sessions.css" />
  </head>
  <body data-theme="rsi">
    <div class="sessions-container">
      <header class="sessions-header">
        <button id="back-btn" class="hud-settings-trigger back-btn" type="button" title="Back to Pilot Profile">&larr; Back</button>
        <div class="sessions-title-wrap">
          <h1>Session History</h1>
          <p class="sessions-subtitle" id="session-count">0 sessions</p>
        </div>
        <button id="start-new-session-btn" class="hud-settings-trigger start-new-session-btn" type="button">Start New Session</button>
      </header>

      <section class="totals-strip" id="totals-strip" aria-label="Overall totals"></section>

      <div class="sessions-list" id="sessions-list"></div>

      <div class="empty-state" id="empty-state" hidden>
        <h2>No Sessions Recorded</h2>
        <p>Session history will appear here once sessions are tracked. Active, completed and failed sessions will show profit, loss, expenses and work order summaries.</p>
      </div>

      <div class="sessions-footer">
        Star Citizen Mining and Salvage Tracker • Sessions Window
      </div>
    </div>

    <dialog class="session-detail-dialog" id="session-detail-dialog" aria-labelledby="session-detail-title">
      <div class="session-detail-panel">
        <div class="session-detail-head">
          <h2 id="session-detail-title">Session Details</h2>
          <button id="close-session-detail" class="hud-settings-trigger" type="button">Close</button>
        </div>
        <div id="session-detail-content"></div>
      </div>
    </dialog>

    <script type="module" src="src/scripts/sessions.js"></script>
  </body>
</html>
